# The cloud deployment. HTTPS for DASHI_DOMAIN comes from the reverse proxy already
# running on the server, which forwards the domain to the port published here; see "Deploy to
# the cloud" in the README. Every other setting comes from .env, which the deploy workflow
# writes.
# The project name keeps the app's name from before the rename to Dashi: Docker Compose names
# the data volume after it, so a new name would start an empty dashboard.
name: agent-dashboard
services:
  dashboard:
    build: .
    image: dashi:cloud
    env_file: .env
    environment:
      DASHI_MODE: cloud
      DASHI_HOST: 0.0.0.0
      DASHI_PUBLIC_URL: https://${DASHI_DOMAIN:-${AGENT_DASHBOARD_DOMAIN:?set DASHI_DOMAIN in .env}}
    # Published on a private address only: the proxy reaches it, the internet does not.
    ports:
      - "${DASHI_PUBLISH_ADDRESS:-${AGENT_DASHBOARD_PUBLISH_ADDRESS:-127.0.0.1}}:${DASHI_PUBLISH_PORT:-${AGENT_DASHBOARD_PUBLISH_PORT:-4317}}:4317"
    volumes:
      - dashboard-data:/data
    restart: unless-stopped

volumes:
  dashboard-data:
