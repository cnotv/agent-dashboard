name: CI

# Pushes to main run these checks through the deploy workflow, which deploys only once they pass.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint --max-warnings 0

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # Starts the same compose files the deployments use, once per mode, and checks them from
  # outside the container the way a browser or the proxy would reach them.
  docker:
    name: docker (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: local
            compose-file: docker-compose.yml
          - mode: cloud
            compose-file: docker-compose.cloud.yml
    env:
      COMPOSE_FILE: ${{ matrix.compose-file }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Use the CI settings for ${{ matrix.mode }} mode
        run: cp .github/ci/${{ matrix.mode }}.env .env
      - name: Build and start, waiting for the healthcheck
        run: docker compose up --build --detach --wait --wait-timeout 90
      - name: Smoke test
        run: node --env-file=.env apps/server/src/ops/smoke-test.ts ${{ matrix.mode }}
      - if: failure()
        run: docker compose logs
