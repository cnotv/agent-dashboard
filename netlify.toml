# Netlify hosts only the static UI. Without a server behind it the build runs in demo mode on
# bundled sample data; set VITE_API_BASE_URL (and drop VITE_DEMO_MODE) to point it at a
# dashboard server instead.
[build]
  command = "pnpm --filter @dashi/web build"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "22"
  VITE_DEMO_MODE = "1"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
